<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eunseo Choi - Intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            font-family: 'Courier Prime', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer; /* 화면 전체가 클릭 가능하다는 표시(마우스 커서 변경) */
            transition: opacity 0.8s ease; /* 클릭 시 화면이 부드럽게 사라지는 효과 */
        }

        /* 페이드 아웃용 클래스 */
        body.fade-out {
            opacity: 0;
        }

        .intro-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .scramble-text {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums; 
        }

        /* 하단 클릭 안내 문구 (디자인을 해치지 않게 아주 작고 흐릿하게) */
        .click-hint {
            position: absolute;
            bottom: 10%;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: #b0b0b0;
            opacity: 0;
            animation: blinker 2s linear infinite;
            transition: opacity 0.5s ease;
        }

        .click-hint.show {
            opacity: 1;
        }

        @keyframes blinker {
            50% { opacity: 0.3; }
        }

        @media (max-width: 768px) {
            .scramble-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="intro-container">
        <div class="scramble-text" id="line1"></div>
        <div class="scramble-text" id="line2"></div>
        <div class="scramble-text" id="line3"></div>
    </div>
    
    <div class="click-hint" id="hint">CLICK ANYWHERE TO ENTER</div>

    <script>
        // 제품 디자이너 + 생일을 조합한 문구 제안
        const finalTexts = [
            "> EUNSEO CHOI _",
            "PRODUCT DESIGN PORTFOLIO",
            "EST. 2003.04.10"
        ];

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=';

        class ScrambleText {
            constructor(el) {
                this.el = el;
                this.chars = chars;
                this.update = this.update.bind(this);
            }
            setText(newText) {
                const oldText = this.el.innerText || "";
                const length = Math.max(oldText.length, newText.length);
                const promise = new Promise((resolve) => this.resolve = resolve);
                this.queue = [];
                for (let i = 0; i < length; i++) {
                    const from = oldText[i] || '';
                    const to = newText[i] || '';
                    const start = Math.floor(Math.random() * 40); 
                    const end = start + Math.floor(Math.random() * 50); 
                    this.queue.push({ from, to, start, end });
                }
                cancelAnimationFrame(this.frameRequest);
                this.frame = 0;
                this.update();
                return promise;
            }
            update() {
                let output = '';
                let complete = 0;
                for (let i = 0, n = this.queue.length; i < n; i++) {
                    let { from, to, start, end, char } = this.queue[i];
                    if (this.frame >= end) {
                        complete++;
                        output += to;
                    } else if (this.frame >= start) {
                        if (!char || Math.random() < 0.28) {
                            char = this.randomChar();
                            this.queue[i].char = char;
                        }
                        output += char;
                    } else {
                        output += from;
                    }
                }
                this.el.innerHTML = output.replace(/ /g, '&nbsp;');
                if (complete === this.queue.length) {
                    this.resolve();
                } else {
                    this.frameRequest = requestAnimationFrame(this.update);
                    this.frame++;
                }
            }
            randomChar() {
                return this.chars[Math.floor(Math.random() * this.chars.length)];
            }
        }

        const el1 = document.getElementById('line1');
        const el2 = document.getElementById('line2');
        const el3 = document.getElementById('line3');
        const hint = document.getElementById('hint');

        const fx1 = new ScrambleText(el1);
        const fx2 = new ScrambleText(el2);
        const fx3 = new ScrambleText(el3);

        setTimeout(() => {
            Promise.all([
                fx1.setText(finalTexts[0]),
                fx2.setText(finalTexts[1]),
                fx3.setText(finalTexts[2])
            ]).then(() => {
                // 글자가 완성되고 1초 뒤에 맨 아래에 조그만 안내 문구 등장
                setTimeout(() => {
                    hint.classList.add('show');
                }, 1000);
            });
        }, 500);

        // 화면 어디든 클릭하면 화면이 부드럽게 사라지며 main.html로 이동
        document.body.addEventListener('click', () => {
            document.body.classList.add('fade-out'); // 페이드 아웃 효과 시작
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 800); // 화면이 하얗게 사라지는 시간(0.8초) 뒤에 페이지 이동
        });
    </script>
</body>
</html>
