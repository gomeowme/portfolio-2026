<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eunseo Choi - Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #222222;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 텍스트 영역 */
        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10%;
            background-color: #ffffff;
            animation: slideInLeft 1s ease-out forwards;
        }

        .greeting {
            font-size: 1.5rem;
            font-weight: 500;
            color: #4a4a4a;
            margin-bottom: 1rem;
        }

        .title {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 2rem;
            color: #111111;
        }

        .title span {
            color: #ff4757; /* 포인트 컬러 */
        }

        .description {
            font-size: 1.2rem;
            font-weight: 400;
            line-height: 1.6;
            color: #666666;
            margin-bottom: 3rem;
            max-width: 400px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #111111;
            text-decoration: none;
            border-radius: 4px;
            width: max-content;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #ff4757;
            transform: translateY(-2px);
        }

        /* 오른쪽 비주얼 영역 */
        .right-section {
            flex: 1;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: fadeIn 1.5s ease-out forwards;
        }

        /* 도형 장식 */
        .shape {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border-radius: 50%;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            top: 15%;
            left: 10%;
        }

        .shape-2 {
            width: 450px;
            height: 450px;
            bottom: -5%;
            right: -10%;
            border-radius: 30px;
            transform: rotate(45deg);
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 모바일 반응형 */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .left-section {
                padding: 10% 5%;
                align-items: center;
                text-align: center;
                order: 2;
                flex: none;
                height: 60vh;
            }
            .right-section {
                order: 1;
                flex: none;
                height: 40vh;
            }
            .title {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <p class="greeting">Hello, I'm</p>
            <h1 class="title">Eunseo<br>Choi<span>.</span></h1>
            <p class="description">Web Designer & Developer. I create intuitive and beautiful web experiences.</p>
            <a href="#projects" class="btn">Explore My Work</a>
        </div>
        <div class="right-section">
            <!-- 차후에 이곳에 본인 사진이나 포트폴리오 대표 이미지를 넣을 수 있습니다 -->
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
        </div>
    </div>
</body>
</html>
